[build-system]
requires = [
  "setuptools == 84.0.0",
  "setuptools_scm[toml] == 10.3.4",
  "frequenz-repo-config[lib] == 0.19.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "griffe-frequenz-core"
description = "A collection of Griffe extensions to teach mkdocstrings about frequenz-core helpers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["frequenz", "python", "lib", "library", "griffe-frequenz-core", "griffe", "mkdocstrings", "mkdocs", "documentation", "extension", "deprecation", "frequenz-core"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: MkDocs",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
requires-python = ">= 3.11, < 4"
dependencies = [
  # The Griffe library, whose distribution is named `griffelib` since 2.0 while
  # the import package stayed `griffe`. The `griffe` distribution is now a
  # meta-package pinning `griffelib` and `griffecli` to one exact version, which
  # a library must not force on anyone. This is also what mkdocstrings-python
  # and griffe-warnings-deprecated depend on.
  "griffelib >= 2.0.0, < 3",
]
dynamic = ["version"]

[[project.authors]]
name = "Frequenz Energy-as-a-Service GmbH"
email = "floss@frequenz.com"

[project.optional-dependencies]
dev-flake8 = [
  "flake8 == 7.4.1",
  "flake8-datetimez == 26.8.1",
  "flake8-docstrings == 1.7.0",
  "flake8-pyproject == 1.2.4",  # For reading the flake8 config from pyproject.toml
  "pydoclint == 0.10.1",
  "pydocstyle == 6.3.0",
]
dev-formatting = ["black == 26.5.1", "isort == 9.0.1"]
dev-mkdocs = [
  "Markdown == 3.11",
  "black == 26.5.1",
  "mike == 2.2.0",
  "mkdocs-gen-files == 0.6.1",
  "mkdocs-literate-nav == 0.6.3",
  "mkdocs-macros-plugin == 1.5.0",
  "mkdocs-material == 9.7.7",
  "mkdocstrings[python] == 1.0.6",
  "mkdocstrings-python == 2.0.9",
  "frequenz-repo-config[lib] == 0.19.0",
]
dev-mypy = [
  "mypy == 2.3.1",
  "types-Markdown == 3.10.2.20260712",
  # For checking the noxfile, docs/ script, and tests
  "griffe-frequenz-core[dev-mkdocs,dev-noxfile,dev-pytest]",
]
dev-noxfile = [
  "nox == 2026.8.17",
  "frequenz-repo-config[lib] == 0.19.0",
]
dev-pylint = [
  # dev-pytest already defines a dependency to pylint because of the examples
  # For checking the noxfile, docs/ script, and tests
  "griffe-frequenz-core[dev-mkdocs,dev-noxfile,dev-pytest]",
]
dev-pytest = [
  "pytest == 9.1.1",
  "pylint == 4.0.9",       # We need this to check for the examples
  "frequenz-repo-config[extra-lint-examples] == 0.19.0",
  "pytest-mock == 3.16.0",
  "pytest-asyncio == 1.4.0",
  "async-solipsism == 0.9",
  # Test-only, and never a runtime dependency: `tests/compat/` runs the real
  # helpers to check that what we document is what a user is told at runtime.
  # The exact pin is the record of the last core release actually tested
  # against, so Dependabot bumping it is the signal that the contract moved.
  "frequenz-core == 1.5.0",
]
dev = [
  "griffe-frequenz-core[dev-mkdocs,dev-flake8,dev-formatting,dev-mkdocs,dev-mypy,dev-noxfile,dev-pylint,dev-pytest]",
]

[project.urls]
Documentation = "https://frequenz-floss.github.io/griffe-frequenz-core/"
Changelog = "https://github.com/frequenz-floss/griffe-frequenz-core/releases"
Issues = "https://github.com/frequenz-floss/griffe-frequenz-core/issues"
Repository = "https://github.com/frequenz-floss/griffe-frequenz-core"
Support = "https://github.com/frequenz-floss/griffe-frequenz-core/discussions/categories/support"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["benchmarks", "examples", "src", "tests"]

[tool.flake8]
# We give some flexibility to go over 88, there are cases like long URLs or
# code in documenation that have extra indentation. Black will still take care
# of making everything that can be 88 wide, 88 wide.
max-line-length = 100
extend-ignore = [
  "E203", # Whitespace before ':' (conflicts with black)
  "W503", # Line break before binary operator (conflicts with black)
]
# pydoclint options
style = "google"
check-return-types = false
check-yield-types = false
arg-type-hints-in-docstring = false
arg-type-hints-in-signature = true
allow-init-docstring = true
check-class-attributes = false

[tool.pylint.similarities]
ignore-comments = ['yes']
ignore-docstrings = ['yes']
ignore-imports = ['no']
min-similarity-lines = 40

[tool.pylint.main]
# The test fixtures are not code, they are input for Griffe to read statically.
# They import packages that are deliberately not installed, and some of them do
# not even exist, so there is nothing for a type checker or a linter to say
# about them that the tests do not already check. Black, isort and flake8 still
# go over them, since those need nothing resolved.
ignore-paths = ["tests/fixtures/.*"]

[tool.pylint.typecheck]
# This package matches the frequenz-core helpers by name and never imports
# them, so frequenz-core is deliberately not a runtime dependency. The
# docstring examples still have to import it to show the shapes being
# documented, and those are linted with pylint (see
# `src/griffe_frequenz_core/conftest.py`).
ignored-modules = ["frequenz.core", "frequenz.core.*"]

[tool.pylint.messages_control]
disable = [
  "too-few-public-methods",
  "too-many-return-statements",
  # disabled because it conflicts with isort
  "wrong-import-order",
  "ungrouped-imports",
  # Checked by mypy (and pylint is very flaky checking these)
  "unsubscriptable-object",
  "no-member",
  "no-name-in-module",
  "possibly-used-before-assignment",
  # The docstring example linter (see `src/griffe_frequenz_core/conftest.py`)
  # prepends every example with a wildcard import of the module the docstring
  # came from. This package is flat rather than namespaced, so pylint resolves
  # that import to the very file it is reading, and reports every example as
  # importing itself and every name an example defines as a redefinition of it.
  # Neither is real, and mypy reports genuine redefinitions anyway
  # (`no-redef`).
  "import-self",
  "function-redefined",
  # Checked by flake8
  "f-string-without-interpolation",
  "line-too-long",
  "missing-function-docstring",
  "redefined-outer-name",
  "unnecessary-lambda-assignment",
  "unused-import",
  "unused-variable",
]

[tool.pytest.ini_options]
filterwarnings = [
  "error",
  "once::DeprecationWarning",
  "once::PendingDeprecationWarning",
  # We ignore warnings about protobuf gencode version being one version older
  # than the current version, as this is supported by protobuf, and we expect to
  # have such cases. If we go too far, we will get a proper error anyways.
  # We use a raw string (single quotes) to avoid the need to escape special
  # characters as this is a regex.
  'ignore:Protobuf gencode version .*exactly one major version older.*:UserWarning',
]
testpaths = ["tests", "src"]
asyncio_debug = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "pytest-mock"]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
# See the comment on pylint's `ignore-paths` above.
exclude = ["^tests/fixtures/"]
# This option disables mypy cache, and it is sometimes useful to enable it if
# you are getting weird intermittent error, or error in the CI but not locally
# (or vice versa). In particular errors saying that type: ignore is not
# used but getting the original ignored error when removing the type: ignore.
# See for example: https://github.com/python/mypy/issues/2960
#no_incremental = true
packages = ["griffe_frequenz_core"]
strict = true
enable_error_code = ["exhaustive-match"]

[[tool.mypy.overrides]]
module = ["mkdocs_macros.*", "sybil", "sybil.*"]
ignore_missing_imports = true

[tool.setuptools_scm]
version_scheme = "post-release"
